# 接线示例：修改话题及实车参数后使用。
# 仅在定位有效后允许发目标；现有节点不会自动等待定位或检查位姿超时。
# 地图发布器须支持 Transient Local，否则修改 map_transient_local。
dddmr_planner:
  ros__parameters:
    map_topic: /prior_map
    path_topic: /init_path
    goal_topic: /goal_pose
    initial_pose_topic: /dddmr/manual_start
    odom_topic: /localization/odom
    start:
    - 0.0
    - 0.0
    - 0.0
    update_map: false
    map_transient_local: true
    planner:
      robot_radius: 0.35
      robot_height: 0.8
      max_slope_deg: 25.0
      max_step: 0.25
      max_roughness: 0.1
      voxel_size: 0.1
      normal_k: 16
      inflation_radius: 0.55
      cost_scaling_factor: 3.0
      lethal_cost: 254.0
      connection_radius: 0.4
      max_neighbors: 12
      edge_collision_check: true
      heuristic_weight: 1.0
      cost_weight: 0.02
      snap_radius: 1.5
      path_resolution: 0.1
      smooth_iterations: 3
      shortcut: true
