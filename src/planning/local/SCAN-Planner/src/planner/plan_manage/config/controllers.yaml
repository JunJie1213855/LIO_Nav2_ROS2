closed_loop_controller:
  ros__parameters:
    use_sim_time: true 
    time_forward: 0.8
    heading_error_threshold: 0.8
    kp_pos: 0.8
    kp_yaw: 1.5
    max_vx: 0.75
    max_vy: 0.0
    max_vyaw: 1.0
    finish_dist: 0.15

closed_loop_controller_car:
  ros__parameters:
    use_sim_time: true
    odom_frame: odom
    max_vx: 0.5
    max_vyaw: 1.0
    max_accel: 0.5
    max_decel: 0.8
    max_yaw_accel: 2.0
    max_lateral_accel: 0.4
    lookahead_min: 0.25
    lookahead_max: 0.6
    lookahead_time: 0.6
    rotate_enter: 0.7 # rad，超过此夹角先原地转向
    rotate_exit: 0.25 # rad，转向滞回，避免频繁启停
    kp_rotate: 1.5
    finish_dist: 0.1
    max_tracking_error: 0.8
    progress_search_distance: 1.0
    odom_timeout: 0.5
    sample_dt: 0.03

open_loop_controller:
  ros__parameters:
    use_sim_time: false
    frame_id: world
    child_frame_id: base
    publish_rate: 100.0
    yaw_min_speed: 0.05
    hold_final_position: true
    init_x: -19.0
    init_y: 1.0
    init_z: 0.3
    init_yaw: 0.0

go2_kinematic_sim:
  ros__parameters:
    use_sim_time: false
    init_x: -19.0
    init_y: 1.0
    init_z: 0.3
    init_yaw: 0.0
    max_vx: 0.75
    max_vy: 0.0
    max_vyaw: 1.0
    cmd_timeout: 0.3
    sim_rate: 100.0
    publish_tf: true
    frame_id: world
    child_frame_id: base

go2_gait_publisher:
  ros__parameters:
    use_sim_time: false
    rate: 60.0
    gait_frequency: 2.2
    min_walk_speed: 0.05
    max_walk_speed: 1.0
    always_trot: false
    hip_swing: 0.08
    thigh_swing: 0.32
    calf_swing: 0.42
